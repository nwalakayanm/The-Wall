<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Wall</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-neutral-900 text-white min-h-screen font-sans">

    <!-- Main Container -->
    <div id="app" class="max-w-md w-full mx-auto h-screen flex flex-col relative overflow-hidden shadow-2xl bg-neutral-900">
        
        <!-- 1. LOGIN VIEW -->
        <div id="view-login" class="flex flex-1 flex-col items-center justify-center p-6 space-y-6">
            <div class="bg-blue-600 p-5 rounded-full shadow-lg shadow-blue-600/30">
                <i class="fa-solid fa-comments text-4xl text-white"></i>
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-bold mb-2">The Wall</h1>
                <p class="text-neutral-400 text-sm">Un réseau social local, éphémère et instantané.</p>
            </div>
            <form id="login-form" class="w-full bg-neutral-800 p-6 rounded-2xl border border-neutral-700 shadow-xl">
                <label class="block text-sm font-medium text-neutral-300 mb-2">Choisis un pseudo</label>
                <div class="relative mb-4">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-neutral-500"></i>
                    <input type="text" id="username-input" placeholder="ex: NinjaDev" required
                        class="w-full bg-neutral-900 border border-neutral-700 rounded-xl py-3 pl-12 pr-4 text-white placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    Rejoindre
                </button>
            </form>
        </div>

        <!-- 2. WALLS LIST VIEW -->
        <div id="view-walls" class="hidden flex-1 flex-col h-full relative">
            <header class="bg-neutral-800 p-4 border-b border-neutral-700 flex justify-between items-center z-10 shrink-0">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-blue-500"></i> Murs Actifs
                    </h1>
                    <p class="text-xs text-neutral-400 mt-1">Connecté: <span id="display-username" class="font-semibold text-blue-400"></span></p>
                </div>
                <button id="btn-show-create" class="bg-neutral-700 w-10 h-10 rounded-full flex items-center justify-center hover:bg-neutral-600 transition active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </header>

            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="walls-container">
                <!-- Create Wall Form (Hidden by default) -->
                <form id="create-wall-form" class="hidden bg-neutral-800 p-4 rounded-xl border border-blue-500/50 shadow-lg shadow-blue-500/10 mb-4">
                    <input type="text" id="new-wall-name" placeholder="Sujet ou lieu du mur..." required
                        class="w-full bg-neutral-900 border border-neutral-700 rounded-lg py-3 px-4 text-white mb-3 focus:outline-none focus:border-blue-500">
                    <div class="flex justify-end gap-2">
                        <button type="button" id="btn-cancel-create" class="px-4 py-2 text-sm text-neutral-400 font-medium">Annuler</button>
                        <button type="submit" class="px-4 py-2 text-sm bg-blue-600 rounded-lg font-bold">Créer</button>
                    </div>
                </form>
                
                <!-- Walls List injected here -->
                <div id="walls-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- 3. CHAT VIEW -->
        <div id="view-chat" class="hidden flex-1 flex-col h-full">
            <header class="bg-neutral-800 p-4 border-b border-neutral-700 flex items-center z-10 shrink-0">
                <button id="btn-back-walls" class="mr-3 w-10 h-10 bg-neutral-700 rounded-full flex items-center justify-center hover:bg-neutral-600 transition active:scale-95">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="flex-1 overflow-hidden">
                    <h1 id="chat-wall-name" class="text-lg font-bold truncate">Nom du Mur</h1>
                    <p class="text-xs text-neutral-400 flex items-center gap-1">
                        <i class="fa-regular fa-clock"></i> Effacement dans 24h
                    </p>
                </div>
            </header>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
                <!-- Messages injected here -->
            </div>

            <footer class="bg-neutral-800 p-3 border-t border-neutral-700 shrink-0 pb-safe">
                <form id="chat-form" class="flex gap-2 items-center">
                    <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" required
                        class="flex-1 bg-neutral-900 border border-neutral-700 rounded-full py-3 px-5 text-white focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center hover:bg-blue-700 transition active:scale-95">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </div>

    </div>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // ⚠️ GITHUB USERS: PASTE YOUR FIREBASE CONFIG HERE
        // ==========================================
        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined') {
            // Environment config (Works in Canvas)
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // YOUR GITHUB CONFIG GOES HERE:
            firebaseConfig = {
                apiKey: "PASTE_YOUR_API_KEY_HERE",
                authDomain: "PASTE_YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "PASTE_YOUR_PROJECT_ID",
                storageBucket: "PASTE_YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "PASTE_YOUR_SENDER_ID",
                appId: "PASTE_YOUR_APP_ID"
            };
        }

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'the-wall-github';

        // State
        let currentUser = null;
        let username = localStorage.getItem('wall_username') || '';
        let currentWallId = null;
        let currentWallName = "";
        let wallsData = [];
        let messagesData = [];
        const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

        // DOM Elements
        const viewLogin = document.getElementById('view-login');
        const viewWalls = document.getElementById('view-walls');
        const viewChat = document.getElementById('view-chat');
        
        // --- Authentication (RULE 3 compliance) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                setupDatabaseListeners();
                if (username) showView('walls');
            }
        });

        // --- Database Listeners (RULE 1 & 2 compliance) ---
        function setupDatabaseListeners() {
            if (!currentUser) return;
            
            // Listen to Walls
            const wallsRef = collection(db, 'artifacts', appId, 'public', 'data', 'walls');
            onSnapshot(wallsRef, (snapshot) => {
                wallsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderWalls();
            }, (error) => console.error("Error fetching walls:", error));

            // Listen to Messages
            const msgsRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            onSnapshot(msgsRef, (snapshot) => {
                messagesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderChat();
                renderWalls(); // Update message counts on walls
            }, (error) => console.error("Error fetching messages:", error));
        }

        // --- Navigation ---
        function showView(viewName) {
            viewLogin.classList.add('hidden');
            viewWalls.classList.add('hidden');
            viewChat.classList.add('hidden');

            if (viewName === 'login') viewLogin.classList.remove('hidden');
            if (viewName === 'walls') {
                viewWalls.classList.remove('hidden');
                document.getElementById('display-username').innerText = username;
                renderWalls();
            }
            if (viewName === 'chat') {
                viewChat.classList.remove('hidden');
                document.getElementById('chat-wall-name').innerText = currentWallName;
                renderChat();
                scrollToBottom();
            }
        }

        // --- View Logic: Login ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('username-input').value.trim();
            if (input.length > 2) {
                username = input;
                localStorage.setItem('wall_username', username);
                if (currentUser) showView('walls');
            }
        });

        // --- View Logic: Walls ---
        const formCreateWall = document.getElementById('create-wall-form');
        document.getElementById('btn-show-create').addEventListener('click', () => {
            formCreateWall.classList.remove('hidden');
            document.getElementById('new-wall-name').focus();
        });
        document.getElementById('btn-cancel-create').addEventListener('click', () => {
            formCreateWall.classList.add('hidden');
            document.getElementById('new-wall-name').value = '';
        });

        formCreateWall.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const nameInput = document.getElementById('new-wall-name');
            const name = nameInput.value.trim();
            if (!name) return;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'walls'), {
                name: name,
                createdAt: Date.now(),
                createdBy: currentUser.uid,
                authorName: username
            });
            
            nameInput.value = '';
            formCreateWall.classList.add('hidden');
        });

        function renderWalls() {
            if (!currentUser) return;
            const container = document.getElementById('walls-list');
            container.innerHTML = '';

            const activeWalls = wallsData.sort((a, b) => b.createdAt - a.createdAt);

            if (activeWalls.length === 0) {
                container.innerHTML = `<div class="text-center text-neutral-500 mt-10"><p>Aucun mur actif.</p></div>`;
                return;
            }

            activeWalls.forEach(wall => {
                // Count active messages for this wall
                const msgCount = messagesData.filter(m => m.wallId === wall.id && (Date.now() - m.createdAt) < TWENTY_FOUR_HOURS).length;

                const div = document.createElement('div');
                div.className = "bg-neutral-800 p-5 rounded-2xl border border-neutral-700 active:scale-95 transition cursor-pointer";
                div.innerHTML = `
                    <h2 class="text-lg font-bold mb-1">${wall.name}</h2>
                    <div class="flex justify-between items-center text-xs text-neutral-400">
                        <span>Par ${wall.authorName}</span>
                        <span class="bg-neutral-700 px-2 py-1 rounded-md text-white font-medium">${msgCount} msg</span>
                    </div>
                `;
                div.addEventListener('click', () => {
                    currentWallId = wall.id;
                    currentWallName = wall.name;
                    showView('chat');
                });
                container.appendChild(div);
            });
        }

        // --- View Logic: Chat ---
        document.getElementById('btn-back-walls').addEventListener('click', () => {
            currentWallId = null;
            showView('walls');
        });

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !currentWallId) return;
            
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = ''; // clear immediately
            
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                wallId: currentWallId,
                text: text,
                author: username,
                authorId: currentUser.uid,
                createdAt: Date.now(),
                upvotes: [],
                downvotes: []
            });
            scrollToBottom();
        });

        // Attach vote handler to window so inline HTML onclick works
        window.handleVote = async (msgId, type) => {
            if (!currentUser) return;
            const msg = messagesData.find(m => m.id === msgId);
            if (!msg) return;

            let upvotes = [...(msg.upvotes || [])];
            let downvotes = [...(msg.downvotes || [])];
            const uid = currentUser.uid;

            if (type === 'up') {
                if (upvotes.includes(uid)) upvotes = upvotes.filter(id => id !== uid);
                else { upvotes.push(uid); downvotes = downvotes.filter(id => id !== uid); }
            } else {
                if (downvotes.includes(uid)) downvotes = downvotes.filter(id => id !== uid);
                else { downvotes.push(uid); upvotes = upvotes.filter(id => id !== uid); }
            }

            const msgRef = doc(db, 'artifacts', appId, 'public', 'data', 'messages', msgId);
            await updateDoc(msgRef, { upvotes, downvotes });
        };

        function renderChat() {
            if (viewChat.classList.contains('hidden') || !currentWallId) return;
            
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            const activeMessages = messagesData
                .filter(m => m.wallId === currentWallId)
                .filter(m => (Date.now() - m.createdAt) < TWENTY_FOUR_HOURS)
                .sort((a, b) => a.createdAt - b.createdAt);

            if (activeMessages.length === 0) {
                container.innerHTML = `<div class="text-center text-neutral-500 mt-10"><p>Ce mur est vide. Sois le premier !</p></div>`;
                return;
            }

            activeMessages.forEach(msg => {
                const isMe = msg.authorId === currentUser?.uid;
                const upvotesCount = (msg.upvotes || []).length;
                const downvotesCount = (msg.downvotes || []).length;
                const score = upvotesCount - downvotesCount;
                
                const hasUpvoted = (msg.upvotes || []).includes(currentUser?.uid);
                const hasDownvoted = (msg.downvotes || []).includes(currentUser?.uid);

                const upClass = hasUpvoted ? 'text-blue-500 bg-blue-500/10' : 'text-neutral-400';
                const downClass = hasDownvoted ? 'text-red-500 bg-red-500/10' : 'text-neutral-400';
                const scoreClass = score > 0 ? 'text-blue-400' : score < 0 ? 'text-red-400' : 'text-neutral-400';

                // Voting HTML component
                const voteHtml = `
                    <div class="flex flex-col items-center bg-neutral-800 rounded-lg p-1 space-y-1 h-fit border border-neutral-700 shadow-sm shrink-0">
                        <button onclick="window.handleVote('${msg.id}', 'up')" class="p-1 rounded w-6 h-6 flex items-center justify-center ${upClass}">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                        <span class="text-xs font-bold ${scoreClass}">${score}</span>
                        <button onclick="window.handleVote('${msg.id}', 'down')" class="p-1 rounded w-6 h-6 flex items-center justify-center ${downClass}">
                            <i class="fa-solid fa-arrow-down text-xs"></i>
                        </button>
                    </div>
                `;

                const bubbleHtml = `
                    <div class="p-3 rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-neutral-800 border border-neutral-700 rounded-bl-sm'}">
                        <p class="text-sm break-words whitespace-pre-wrap leading-relaxed">${msg.text}</p>
                    </div>
                `;

                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                
                div.innerHTML = `
                    <span class="text-[10px] text-neutral-400 mb-1 px-1 font-medium">${msg.author}</span>
                    <div class="flex gap-2 max-w-[85%]">
                        ${!isMe ? voteHtml : ''}
                        ${bubbleHtml}
                        ${isMe ? voteHtml : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
        }

        // Init App view
        if (username) {
            showView('walls');
        } else {
            showView('login');
        }
    </script>
</body>
</html>
