<body>

<div id="app">

    <!-- 🚀 BANNIÈRE D'INSTALLATION PWA -->
    <div id="install-banner" class="install-banner">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fa-solid fa-download"></i>
            <span style="font-size:13px; font-weight:600;">Installer The Wall sur ton téléphone</span>
        </div>
        <button id="btn-install" class="install-btn">Installer</button>
    </div>

    <!-- ── 1. LOGIN ── -->
    <div id="view-login" class="view">
        <div class="login-icon">💬</div>
        <h1 class="login-title">The Wall</h1>
        <p class="login-sub">Un espace éphémère. Anonyme. Instantané. Réel.</p>

        <div class="login-card">
            <form id="login-form">
                <div class="input-wrap">
                    <i class="fa-solid fa-at"></i>
                    <input type="text" id="username-input" placeholder="Choisis un pseudo..." maxlength="20" autocomplete="off" required>
                </div>
                <button type="submit" class="btn-primary">Rejoindre le mur →</button>
            </form>
        </div>

        <div class="login-tags">
            <span class="tag" onclick="fillPseudo(this)">NinjaDev</span>
            <span class="tag" onclick="fillPseudo(this)">Anonyme</span>
            <span class="tag" onclick="fillPseudo(this)">ShadowX</span>
        </div>
    </div>

    <!-- ── 2. WALLS ── -->
    <div id="view-walls" class="view">
        <header class="app-header">
            <div class="header-left">
                <h1>🏛️ The Wall</h1>
                <p>Salut, <span class="username-badge" id="display-username"></span></p>
            </div>
            <button class="btn-icon" id="btn-show-create">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <div class="walls-scroll">
            <div id="create-wall-form" class="create-form">
                <div class="input-wrap" style="margin-bottom:12px">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="new-wall-name" placeholder="Nom du mur..." maxlength="40">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-ghost" id="btn-cancel-create">Annuler</button>
                    <button type="button" class="btn-small" id="btn-submit-create">Créer</button>
                </div>
            </div>

            <p class="section-label">Murs actifs</p>
            <div id="walls-list"></div>
        </div>
    </div>

    <!-- ── 3. CHAT ── -->
    <div id="view-chat" class="view">
        <header class="chat-header">
            <button class="btn-icon" id="btn-back-walls">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div style="flex:1; overflow:hidden">
                <div class="chat-title" id="chat-wall-name"></div>
                <div class="chat-sub">
                    <span class="live-dot"></span>
                    <span>Effacé dans 24h</span>
                </div>
            </div>
        </header>

        <div class="chat-messages" id="chat-messages"></div>

        <footer class="chat-footer">
            <div class="chat-input-row">
                <div class="chat-input-wrap">
                    <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" maxlength="500">
                </div>
                <button class="btn-send" id="btn-send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// TON CONFIG FIREBASE ICI
const firebaseConfig = {
    apiKey: "AIzaSyBnAl2YkXpEeYXgwSAaFbwCNTnofniV9N4",
    authDomain: "walls-3880c.firebaseapp.com",
    projectId: "walls-3880c",
    storageBucket: "walls-3880c.firebasestorage.app",
    messagingSenderId: "866290594345",
    appId: "1:866290594345:web:1fc8805c3f92a8ddcf2238"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const APP_ID = 'the-wall-github';
const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

let currentUser = null;
let username = localStorage.getItem('wall_username') || '';
let currentWallId = null;
let currentWallName = '';
let wallsData = [];
let messagesData = [];

// 🚀 ENREGISTREMENT DU SERVICE WORKER (PWA)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('PWA Service Worker enregistré !'))
            .catch(err => console.log('Erreur SW: ', err));
    });
}

// 🚀 GESTION DE L'INSTALLATION PWA
let deferredPrompt;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('btn-install');

window.addEventListener('beforeinstallprompt', (e) => {
    // Empêcher l'affichage automatique
    e.preventDefault();
    deferredPrompt = e;
    // Afficher notre bannière custom
    installBanner.classList.add('show');
});

installBtn.addEventListener('click', async () => {
    installBanner.classList.remove('show');
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('App installée !');
        }
        deferredPrompt = null;
    }
});

// Appareils Apple (iOS) ne supportent pas bien le bouton d'installation, 
// les utilisateurs doivent faire "Partager" -> "Sur l'écran d'accueil"

// ── LOGIQUE DE L'APP ──
const initAuth = async () => {
    try {
        await signInAnonymously(auth);
    } catch (err) { console.error('Auth error:', err); }
};
initAuth();

onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
        setupListeners();
        if (username) showView('walls');
        else showView('login');
    }
});

function setupListeners() {
    onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'walls'), (snap) => {
        wallsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderWalls();
    });

    onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), (snap) => {
        messagesData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderWalls();
        if (currentWallId) renderChat();
    });
}

function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    if (name === 'walls') {
        document.getElementById('display-username').textContent = username;
        renderWalls();
    }
    if (name === 'chat') {
        document.getElementById('chat-wall-name').textContent = currentWallName;
        renderChat();
        setTimeout(scrollToBottom, 50);
    }
}

document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('username-input').value.trim();
    if (val.length >= 2) {
        username = val;
        localStorage.setItem('wall_username', username);
        if (currentUser) showView('walls');
    }
});

window.fillPseudo = (el) => {
    document.getElementById('username-input').value = el.textContent;
};

document.getElementById('btn-show-create').addEventListener('click', () => {
    document.getElementById('create-wall-form').classList.toggle('open');
});
document.getElementById('btn-cancel-create').addEventListener('click', () => {
    document.getElementById('create-wall-form').classList.remove('open');
});

document.getElementById('btn-submit-create').addEventListener('click', async () => {
    if (!currentUser) return;
    const name = document.getElementById('new-wall-name').value.trim();
    if (!name) return;
    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'walls'), {
        name, createdAt: Date.now(), createdBy: currentUser.uid, authorName: username
    });
    document.getElementById('new-wall-name').value = '';
    document.getElementById('create-wall-form').classList.remove('open');
});

function renderWalls() {
    const container = document.getElementById('walls-list');
    const sorted = [...wallsData].sort((a, b) => b.createdAt - a.createdAt);

    if (sorted.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots"></i><p>Aucun mur actif.</p></div>`;
        return;
    }

    container.innerHTML = '';
    sorted.forEach((wall) => {
        const count = messagesData.filter(m => m.wallId === wall.id && (Date.now() - m.createdAt) < TWENTY_FOUR_HOURS).length;
        const div = document.createElement('div');
        div.className = 'wall-card';
        div.innerHTML = `
            <div class="wall-name"># ${wall.name}</div>
            <div class="wall-meta">
                <span class="wall-author">par ${wall.authorName}</span>
                <span class="msg-badge"><i class="fa-regular fa-comment"></i> ${count}</span>
            </div>
        `;
        div.addEventListener('click', () => {
            currentWallId = wall.id;
            currentWallName = wall.name;
            showView('chat');
        });
        container.appendChild(div);
    });
}

document.getElementById('btn-back-walls').addEventListener('click', () => {
    currentWallId = null;
    showView('walls');
});

document.getElementById('btn-send').addEventListener('click', sendMessage);

async function sendMessage() {
    if (!currentUser || !currentWallId) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages'), {
        wallId: currentWallId, text, author: username,
        authorId: currentUser.uid, createdAt: Date.now(),
        upvotes: [], downvotes: []
    });
    scrollToBottom();
}

function renderChat() {
    if (!currentWallId) return;
    const container = document.getElementById('chat-messages');
    
    const active = messagesData
        .filter(m => m.wallId === currentWallId && (Date.now() - m.createdAt) < TWENTY_FOUR_HOURS)
        .sort((a, b) => a.createdAt - b.createdAt);

    if (active.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Le mur est vide.</p></div>`;
        return;
    }

    container.innerHTML = '';
    active.forEach(msg => {
        const isMe = msg.authorId === currentUser?.uid;
        const score = (msg.upvotes || []).length - (msg.downvotes || []).length;
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'me' : 'them'}`;

        row.innerHTML = `
            <span class="msg-author">${isMe ? 'Toi' : msg.author}</span>
            <div class="msg-bubble-wrap">
                <div class="msg-bubble">${escapeHtml(msg.text)}</div>
            </div>
        `;
        container.appendChild(row);
    });
    scrollToBottom();
}

function scrollToBottom() {
    const container = document.getElementById('chat-messages');
    container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

</script>
</body>
</html>
